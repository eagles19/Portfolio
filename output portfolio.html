<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chester's Portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23DA291C%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23FFC72C%22 font-family=%22sans-serif%22 font-weight=%22bold%22>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#8a0378;
  --red-dark:#0e2902c9;
  --yellow:#FFC72C;
  --yellow-dark:#E8AE00;
  --ink:#2b2b2b;
  --ink-soft:#6b6b6b;
  --bg:#F4F4F2;
  --card:#ffffff;
  --line:#e7e3dc;
  --radius:18px;
  --shadow:0 10px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Poppins", ui-sans-serif, system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171512;
    --card:#232019;
    --ink:#f3ede2;
    --ink-soft:#c9c0b2;
    --line:#3a352c;
  }
}
:root[data-theme="dark"]{
  --bg:#171512; --card:#232019; --ink:#f3ede2; --ink-soft:#c9c0b2; --line:#3a352c;
}

/* ---------- ANIMATED SKY BACKGROUND ---------- */
/* pixel-art parallax scene by Jenaro Calvino: https://codepen.io/jenaroc/pen/BagQbBx */
#scenery{
  position:fixed; inset:0; z-index:-1;
  overflow:hidden;
  background:#87CEEB;
}
#scenery > div{
  position:absolute;
  left:0; right:0;
  image-rendering:pixelated;
  width:100%;
  background-size:100%;
  background-repeat:repeat-x;
}
@keyframes scn-move-x{ from{background-position-x:0vw;} to{background-position-x:-100vw;} }
@keyframes scn-move-y{ from{background-position-y:50%;} to{background-position-y:52%;} }
.scn-bg{
  inset:0;
  background-image:url("https://assets.codepen.io/3864932/bg.png");
  background-size:cover;
  background-position:center;
}
.scn-clouds{
  top:0; height:50vh;
  background-image:url("https://assets.codepen.io/3864932/clouds.png");
  animation:scn-move-x 7s steps(60) infinite, scn-move-y 3s steps(2) infinite;
}
.scn-clouds-front{
  top:0; height:50vh;
  background-image:url("https://assets.codepen.io/3864932/cloudsfront.png");
  animation:scn-move-x 4s steps(60) infinite, scn-move-y 1s steps(2) infinite;
}
.scn-beach{
  bottom:0; height:60vh;
  background-image:url("https://assets.codepen.io/3864932/beach.png");
  animation:scn-move-x 15s steps(120) infinite;
  background-position-y:bottom;
  background-size:contain;
}
@keyframes scn-char{ from{background-position-x:0;} to{background-position-x:calc(calc(-1 * var(--steps)) * var(--size));} }
.scn-char{
  --size:64px; --steps:5;
  bottom:20px; left:50px;
  background-image:url("https://assets.codepen.io/3864932/character.png");
  background-size:calc(var(--steps) * 100%);
  background-repeat:no-repeat;
  width:var(--size);
  height:calc(2 * var(--size));
  animation:scn-char 1s steps(var(--steps)) infinite;
}

/* ---------- START SCREEN ---------- */
#start-screen{
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(160deg, rgba(168,30,20,.55), rgba(109,19,12,.7));
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  cursor:pointer;
}
#start-screen.hide{display:none;}
.start-card{
  text-align:center;
  color:#fff;
  max-width:420px;
}
.logo-badge{
  width:96px; height:96px; border-radius:24px;
  background:var(--yellow);
  color:var(--red-dark);
  font-weight:800; font-size:40px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
  box-shadow:var(--shadow);
}
.logo-badge.small{width:44px;height:44px;border-radius:12px;font-size:20px;margin:0;}
.start-card h1{
  font-size:clamp(28px,7vw,40px);
  letter-spacing:.03em;
  margin:0 0 8px;
  font-weight:800;
}
.start-card p{color:#ffe3d9; margin:0 0 26px; font-size:15px;}
.btn-primary{
  background:var(--yellow);
  color:var(--red-dark);
  border:none;
  font-weight:800;
  letter-spacing:.02em;
  border-radius:999px;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
  box-shadow:0 8px 0 var(--yellow-dark);
}
.btn-primary:active{transform:translateY(4px); box-shadow:0 4px 0 var(--yellow-dark);}
.btn-primary.big{padding:18px 40px; font-size:17px;}

/* ---------- KIOSK SHELL ---------- */
#kiosk{
  max-width:1080px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px;
  background:var(--red);
  color:#f1ebeb;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-name{font-weight:800; font-size:18px; letter-spacing:.02em;}
.brand-tag{font-size:12px; color:#ffd9d1;}
.ticket{text-align:right;}
.ticket-label{font-size:10px; letter-spacing:.08em; color:#ffd9d1;}
.ticket-num{font-size:20px; font-weight:800; color:var(--yellow);}

.catbar{
  display:flex; gap:8px; overflow-x:auto;
  padding:12px 16px;
  background:var(--yellow);
  scrollbar-width:none;
}
.catbar::-webkit-scrollbar{display:none;}
.catbtn{
  flex:0 0 auto;
  background:#1a1919;
  border:2px solid transparent;
  color:var(--ink);
  font-weight:700;
  font-size:13px;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
}
.catbtn.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red-dark);
}

.stage{
  flex:1;
  padding:20px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.stage-inner{max-width:100%;}
.stage h2{
  font-size:20px;
  font-weight:800;
  margin:2px 0 4px;
}
.stage .lede{color:var(--ink-soft); font-size:14px; margin:0 0 18px;}

.tile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
  gap:14px;
}
.tile{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  cursor:pointer;
  border:2px solid transparent;
  transition:transform .1s ease, border-color .1s ease;
  text-align:left;
}
.tile:hover{transform:translateY(-2px); border-color:var(--yellow);}
.tile-icon{
  width:56px; height:56px;
  border-radius:14px;
  background:#fff3e0;
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
  margin-bottom:10px;
}
.tile-tag{
  display:inline-block;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:999px;
  margin-bottom:6px;
}
.tile h3{margin:0 0 4px; font-size:15px; font-weight:700;}
.tile p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

.combo-banner{
  background:linear-gradient(120deg,var(--yellow),#ffdd7a);
  border-radius:var(--radius);
  padding:16px 18px;
  margin-bottom:18px;
  display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow);
}
.combo-banner .emoji{font-size:34px;}
.combo-banner b{display:block; font-size:14px;}
.combo-banner span{font-size:12.5px; color:#6b5300;}

.kv-list{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 18px;}
.kv-row{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--ink-soft); font-size:13px;}
.kv-row a{color:var(--red); font-weight:700; text-decoration:none; font-size:13px;}

/* ---------- FORM SCREENS (contact / guestbook) ---------- */
.order-panel{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  max-width:480px;
}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
.field input, .field textarea{
  width:100%;
  border:2px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font-family:inherit;
  font-size:14px;
  background:var(--bg);
  color:var(--ink);
}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--red);}
.field textarea{resize:vertical; min-height:80px;}
.submitbar{display:flex; align-items:center; gap:12px; margin-top:6px;}
.status-msg{font-size:13px; color:var(--ink-soft);}
.status-msg.ok{color:#1a8a3d; font-weight:700;}
.status-msg.err{color:var(--red); font-weight:700;}

.entry{
  background:var(--card);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:12px 14px;
  margin-bottom:10px;
  border-left:6px solid var(--yellow);
}
.entry .who{font-weight:700; font-size:13px;}
.entry .when{font-size:11px; color:var(--ink-soft);}
.entry .msg{font-size:13.5px; margin-top:3px;}

.bottombar{
  display:flex; justify-content:space-between;
  padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));
  background:#2f2c2c;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--ink-soft);
}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed; inset:0; z-index:90;
  background:rgba(0, 0, 0, 0.5);
  display:none;
  align-items:center; justify-content:center;
  padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal{
  background:var(--card);
  border-radius:var(--radius);
  max-width:440px; width:100%;
  padding:24px;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:80vh;
  overflow-y:auto;
}
.modal-close{
  position:absolute; top:12px; right:12px;
  width:32px; height:32px; border-radius:50%;
  border:none; background:var(--line);
  font-size:18px; cursor:pointer; line-height:1;
  color:var(--ink);
}
.modal .tile-tag{margin-bottom:10px;}
.modal h2{margin:0 0 8px; font-size:19px;}
.modal p{color:var(--ink-soft); font-size:14px; line-height:1.5;}
.modal-shot{width:100%; border-radius:12px; margin-bottom:14px; display:block;}

/* ---------- ABOUT LAYOUT ---------- */
.about-layout{
  display:flex;
  gap:20px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.about-main{
  flex:1 1 320px;
  min-width:0;
}
.about-photo{
  display:left;
  width:180px; height:180px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 14px;
  border:4px solid var(--yellow);
  box-shadow:var(--shadow);
}

/* ---------- NOW PLAYING ---------- */
.now-playing{
  flex:0 1 300px;
  background:linear-gradient(165deg,#171616,#4a494a);
  border-radius:26px;
  padding:16px;
  box-shadow:var(--shadow);
  color:#fff;
  }
  .np-photo{
  width:100%;
  aspect-ratio:1/1;
  border-radius:18px;
  overflow:hidden;
  border:3px dashed rgba(255,255,255,.6);
  margin-bottom:12px;
}
.np-photo img{width:100%; height:100%; object-fit:cover; display:block;}
.np-label{font-size:11px; font-weight:700; letter-spacing:.04em; opacity:.85; margin-bottom:4px;}
.np-song{font-weight:800; font-size:16px;}
.np-artist{font-size:12.5px; opacity:.9; margin-bottom:10px;}
.np-embed{border-radius:12px; margin-top:4px;}
.np-open{display:inline-block; margin-top:8px; font-size:12px; color:#fff; text-decoration:underline;}
.np-todo{font-size:12.5px; background:rgba(0,0,0,.2); border-radius:10px; padding:10px 12px; margin-top:6px;}

::selection{background:var(--yellow); color:var(--red-dark);}

@media(max-width:560px){
  .topbar{padding:12px 14px;}
  .stage{padding:14px;}
  .tile-grid{grid-template-columns:repeat(auto-fill, minmax(150px,1fr));}
}


/* ---------- ABOUT ME REDESIGN ---------- */
.about-layout-centered{
  align-items:stretch;
  justify-content:center;
}
.about-copy{
  flex:1 1 560px;
}
.about-text-panel{
  max-width:none;
  text-align:center;
  padding:26px 34px;
}
.about-text-panel .about-role{
  color:var(--red);
  font-weight:800;
  margin-bottom:12px;
}
.about-text-panel p:not(.lede){
  max-width:720px;
  margin:0 auto 10px;
  line-height:1.7;
}
.about-info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
}
.about-info-card{
  max-width:none;
  padding:20px;
}
.about-info-card h3{
  margin:0 0 14px;
  font-size:16px;
}
.about-card-icon{
  font-size:27px;
  margin-bottom:7px;
}
.about-detail{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:12.5px;
}
.about-detail:last-child{border-bottom:none;}
.about-detail span{color:var(--ink-soft);}
.about-detail strong{text-align:right;overflow-wrap:anywhere;}
.hobby-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.hobby-pill{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
}
.about-photo-card{
  flex:0 1 300px;
  min-width:250px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}
.about-photo-frame{
  width:100%;
  aspect-ratio:1/1;
  border-radius:22px;
  overflow:hidden;
  border:5px solid var(--yellow);
}
.about-photo-large{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.about-photo-caption{
  font-size:13px;
  font-weight:700;
  margin-top:12px;
}

/* ---------- MINI GAME ---------- */
.game-layout{
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);
  gap:18px;
  align-items:start;
}
.game-panel,.leaderboard-panel{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}
.game-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}
.game-header h3,.leaderboard-title h3{
  margin:0 0 5px;
  font-size:18px;
}
.game-header p{
  margin:0;
  color:var(--ink-soft);
  font-size:12.5px;
}
.game-stat{
  min-width:65px;
  text-align:center;
  background:var(--bg);
  border-radius:14px;
  padding:8px 10px;
}
.game-stat span{
  display:block;
  font-size:9px;
  font-weight:800;
  color:var(--ink-soft);
}
.game-stat strong{font-size:24px;}
.game-score-row{
  display:flex;
  justify-content:space-between;
  padding:12px 2px 8px;
  font-size:13px;
}
.game-board{
  position:relative;
  height:330px;
  border-radius:18px;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,199,44,.32), transparent 22%),
    linear-gradient(135deg,#211b38,#5c177f);
  border:3px solid var(--yellow);
}
.game-message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:6px;
  color:#fff;
  text-align:center;
  z-index:2;
  pointer-events:none;
  padding:20px;
}
.game-message strong{font-size:24px;}
.game-message span{font-size:13px;opacity:.9;}
.game-message.hidden{display:none;}
.game-target{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  border:5px solid #fff;
  background:var(--yellow);
  color:var(--red);
  font-size:22px;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.25);
  z-index:3;
}
.game-target:active{
  transform:scale(.9);
}
.game-controls{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  align-items:center;
  margin-top:13px;
}
.game-name-input{
  flex:1 1 170px;
  min-width:0;
  border:2px solid var(--line);
  border-radius:999px;
  padding:11px 14px;
  font-family:inherit;
  background:var(--bg);
  color:var(--ink);
}
.game-name-input:focus{outline:none;border-color:var(--red);}
.game-controls .btn-primary{
  padding:11px 18px;
}
.game-leave{
  border:2px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  border-radius:999px;
  padding:9px 14px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}
.leaderboard-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.refresh-board{
  border:0;
  background:var(--bg);
  color:var(--ink);
  border-radius:50%;
  width:34px;
  height:34px;
  cursor:pointer;
  font-size:20px;
}
.leaderboard-list{margin-top:12px;}
.leaderboard-empty{
  color:var(--ink-soft);
  font-size:13px;
  padding:15px 0;
}
.leader-row{
  display:grid;
  grid-template-columns:35px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.leader-row:last-child{border-bottom:none;}
.leader-rank{
  font-size:17px;
  text-align:center;
}
.leader-name{
  min-width:0;
}
.leader-name strong{
  display:block;
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.leader-name small{
  display:block;
  color:var(--ink-soft);
  font-size:9px;
  margin-top:2px;
}
.leader-score{
  color:var(--red);
  font-size:17px;
}

@media(max-width:760px){
  .game-layout{grid-template-columns:1fr;}
  .about-info-grid{grid-template-columns:1fr;}
  .about-photo-card{max-width:360px;margin:0 auto;width:100%;}
}
@media(max-width:560px){
  .game-board{height:280px;}
  .about-text-panel{padding:20px 16px;}
}

.about-side-column{
  flex:0 1 300px;
  min-width:250px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.about-side-column .about-photo-card{
  width:100%;
}
.about-now-playing{
  width:100%;
  box-sizing:border-box;
}
@media(max-width:760px){
  .about-side-column{max-width:360px;margin:0 auto;width:100%;}
}

/* ---------- NICE TO MEET YOU ---------- */
.nice-to-meet-you-card{
  min-height:100%;
  min-width:250px;
  border-radius:var(--radius);
  background:linear-gradient(145deg,var(--yellow),#fff1a8);
  color:var(--red-dark);
  box-shadow:var(--shadow);
  padding:42px 28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.nice-icon{font-size:48px;margin-bottom:14px;}
.nice-title{font-size:25px;font-weight:900;line-height:1.1;}
.nice-subtitle{margin-top:10px;max-width:230px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
@media(max-width:760px){
  .nice-to-meet-you-card{min-height:190px;width:100%;}
}

</style>
</head>
<body>

<!-- Animated pixel-art sky background — layers by Jenaro Calvino (codepen.io/jenaroc/pen/BagQbBx) -->
<div id="scenery" aria-hidden="true">
  <div class="scn-bg"></div>
  <div class="scn-clouds"></div>
  <div class="scn-clouds-front"></div>
  <div class="scn-beach"></div>

<script>
/* db, firebaseReady come from js/firebase-config.js; CONTENT comes from
   js/content.js — plain scripts loaded before this one share the same
   global scope, so no imports are needed here. */

/* =========================================================================
   START SCREEN
   ========================================================================= */
document.getElementById("logo-badge").textContent = CONTENT.initial;
document.getElementById("logo-badge-2").textContent = CONTENT.initial;
document.getElementById("start-title").textContent = `WELCOME TO ${CONTENT.name.toUpperCase()}'S HUB`;
document.getElementById("brand-name").textContent = CONTENT.name;
document.getElementById("brand-tag").textContent = CONTENT.tagline;

const startScreen = document.getElementById("start-screen");
const kiosk = document.getElementById("kiosk");

startScreen.addEventListener("click", enterKiosk, { once:true });

function enterKiosk(){
  startScreen.classList.add("hide");
  kiosk.style.display = "flex";
  bumpVisitCounter();
  renderCategory("home");
}

/* =========================================================================
   CATEGORY NAV
   ========================================================================= */
const CATEGORIES = [
  { id:"home",      label:"🏠 Home" },
  { id:"about",     label:"👤 About Me" },
  { id:"work",      label:"💼 My Work" },
  { id:"skills",    label:"🛠️ Skills" },
  { id:"links",     label:"🔗 Links" },
  { id:"contact",   label:"✉️ Contact" },
  { id:"guestbook", label:"📝 Guestbook" },
  { id:"games",     label:"🎮 Mini Games" }
];

const catbar = document.getElementById("catbar");
const stage = document.getElementById("stage");
const bottomHint = document.getElementById("bottom-hint");

CATEGORIES.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "catbtn";
  btn.dataset.cat = cat.id;
  btn.textContent = cat.label;
  btn.addEventListener("click", () => renderCategory(cat.id));
  catbar.appendChild(btn);
});

function setActiveCat(id){
  [...catbar.children].forEach(b => b.classList.toggle("active", b.dataset.cat === id));
}

function renderCategory(id){
  if (activeGame && activeGame.running) saveGameScore("navigation");
  setActiveCat(id);
  stage.innerHTML = "";
  const el = document.createElement("div");
  el.className = "stage-inner";
  stage.appendChild(el);

  const renderers = { home: renderHome, about: renderAbout, work: renderWork, skills: renderSkills, links: renderLinks, contact: renderContact, guestbook: renderGuestbook, games: renderGames };
  bottomHint.textContent = "Browsing: " + (CATEGORIES.find(c => c.id === id)?.label.replace(/^\S+\s/, "") || id);
  (renderers[id] || renderHome)(el);
}

function renderContact(el){
  el.innerHTML = `
    <h2>Contact</h2>
    <p class="lede">Send a message — it's saved straight to Firebase.</p>
    <div class="order-panel">
      <div class="field"><label>Name</label><input type="text" id="c-name" /></div>
      <div class="field"><label>Email</label><input type="text" id="c-email" /></div>
      <div class="field"><label>Message</label><textarea id="c-msg"></textarea></div>
      <div class="submitbar">
        <button class="btn-primary" id="c-send" style="padding:12px 26px;">SEND MESSAGE</button>
        <span class="status-msg" id="c-status"></span>
      </div>
    </div>
  `;
  el.querySelector("#c-send").addEventListener("click", async () => {
    const name = el.querySelector("#c-name").value.trim();
    const email = el.querySelector("#c-email").value.trim();
    const message = el.querySelector("#c-msg").value.trim();
    const status = el.querySelector("#c-status");
    if (!message) { status.textContent = "Write a message first."; status.className = "status-msg err"; return; }
    if (!firebaseReady) { status.textContent = "Firebase isn't configured yet — see js/firebase-config.js"; status.className = "status-msg err"; return; }
    status.textContent = "Sending…"; status.className = "status-msg";
    try {
      await db.collection("contact_messages").add({ name: name || "anonymous", email, message, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      status.textContent = "Sent — thanks!"; status.className = "status-msg ok";
      el.querySelectorAll("input,textarea").forEach(i => i.value = "");
    } catch (e) {
      console.error(e);
      status.textContent = "Failed to send — check console / Firestore rules."; status.className = "status-msg err";
    }
  });
}

function renderGuestbook(el){
  el.innerHTML = `
    <h2>Guestbook</h2>
    <p class="lede">Leave a note for the next visitor.</p>
    <div id="gb-list" class="status-msg">Loading entries…</div>
    <div class="order-panel" style="margin-top:14px;">
      <div class="field"><label>Name</label><input type="text" id="g-name" /></div>
      <div class="field"><label>Message</label><textarea id="g-msg"></textarea></div>
      <div class="submitbar">
        <button class="btn-primary" id="g-sign" style="padding:12px 26px;">SIGN GUESTBOOK</button>
        <span class="status-msg" id="g-status"></span>
      </div>
    </div>
  `;
  const listEl = el.querySelector("#gb-list");

  async function loadEntries(){
    if (!firebaseReady) { listEl.innerHTML = `<span class="err">Firebase isn't configured yet — see js/firebase-config.js</span>`; return; }
    try {
      const snap = await db.collection("guestbook").orderBy("createdAt", "desc").limit(10).get();
      if (snap.empty) { listEl.innerHTML = `no entries yet — be the first.`; return; }
      listEl.innerHTML = snap.docs.map(d => {
        const v = d.data();
        const when = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleString() : "";
        return `<div class="entry"><div class="who">${esc(v.name || "anonymous")}</div><div class="msg">${esc(v.message || "")}</div><div class="when">${when}</div></div>`;
      }).join("");
    } catch (e) {
      console.error(e);
      listEl.innerHTML = `couldn't load entries — check console / Firestore rules.`;
    }
  }
  loadEntries();

  el.querySelector("#g-sign").addEventListener("click", async () => {
    const name = el.querySelector("#g-name").value.trim();
    const message = el.querySelector("#g-msg").value.trim();
    const status = el.querySelector("#g-status");
    if (!message) { status.textContent = "Write something first."; status.className = "status-msg err"; return; }
    if (!firebaseReady) { status.textContent = "Firebase isn't configured yet."; status.className = "status-msg err"; return; }
    status.textContent = "Posting…"; status.className = "status-msg";
    try {
      await db.collection("guestbook").add({ name: name || "anonymous", message, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      status.textContent = "Posted."; status.className = "status-msg ok";
      el.querySelector("#g-name").value = ""; el.querySelector("#g-msg").value = "";
      loadEntries();
    } catch (e) {
      console.error(e);
      status.textContent = "Failed — check console / Firestore rules."; status.className = "status-msg err";
    }
  });
}


let activeGame = null;

function renderGames(el){
  el.innerHTML = `
    <h2>Mini Games</h2>
    <p class="lede">Play, save your score, and see how you rank on the leaderboard.</p>

    <div class="game-layout">
      <div class="game-panel">
        <div class="game-header">
          <div>
            <div class="tile-tag">30 SECOND CHALLENGE</div>
            <h3>🎯 Catch the Dot</h3>
            <p>Click the moving target as many times as you can before time runs out.</p>
          </div>
          <div class="game-stat">
            <span>TIME</span>
            <strong id="game-time">30</strong>
          </div>
        </div>

        <div class="game-score-row">
          <span>Score: <strong id="game-score">0</strong></span>
          <span>Best: <strong id="game-best">—</strong></span>
        </div>

        <div id="game-board" class="game-board">
          <div class="game-message" id="game-message">
            <strong>Ready?</strong>
            <span>Enter your name, then start the game.</span>
          </div>
        </div>

        <div class="game-controls">
          <input id="game-player" class="game-name-input" maxlength="30" placeholder="Your name">
          <button class="btn-primary" id="game-start">START GAME</button>
          <button class="game-leave" id="game-leave" type="button">SAVE & LEAVE</button>
          <span class="status-msg" id="game-status"></span>
        </div>
      </div>

      <div class="leaderboard-panel">
        <div class="leaderboard-title">
          <div>
            <div class="tile-tag">TOP SCORES</div>
            <h3>🏆 Leaderboard</h3>
          </div>
          <button class="refresh-board" id="leaderboard-refresh">↻</button>
        </div>
        <div id="leaderboard-list" class="leaderboard-list">
          Loading scores…
        </div>
      </div>
    </div>
  `;

  activeGame = {
    running: false,
    saved: false,
    player: "",
    score: 0,
    timeLeft: 30,
    timer: null
  };

  const board = el.querySelector("#game-board");
  const message = el.querySelector("#game-message");
  const scoreEl = el.querySelector("#game-score");
  const timeEl = el.querySelector("#game-time");
  const bestEl = el.querySelector("#game-best");
  const playerInput = el.querySelector("#game-player");
  const startBtn = el.querySelector("#game-start");
  const leaveBtn = el.querySelector("#game-leave");
  const status = el.querySelector("#game-status");
  const list = el.querySelector("#leaderboard-list");

  async function loadLeaderboard(){
    if (!firebaseReady) {
      list.innerHTML = `<div class="leaderboard-empty">Firebase is not configured.</div>`;
      return;
    }

    try {
      const snap = await db.collection("game_scores")
        .orderBy("score", "desc")
        .limit(10)
        .get();

      if (snap.empty) {
        list.innerHTML = `<div class="leaderboard-empty">No scores yet. Be the first!</div>`;
        bestEl.textContent = "—";
        return;
      }

      const scores = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      bestEl.textContent = scores[0].score ?? 0;

      list.innerHTML = scores.map((v, i) => {
        const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i + 1}`;
        return `
          <div class="leader-row">
            <span class="leader-rank">${medal}</span>
            <div class="leader-name">
              <strong>${esc(v.name || "Anonymous")}</strong>
              <small>${v.createdAt?.toDate ? v.createdAt.toDate().toLocaleString() : ""}</small>
            </div>
            <strong class="leader-score">${Number(v.score || 0)}</strong>
          </div>
        `;
      }).join("");
    } catch (e) {
      console.error(e);
      list.innerHTML = `<div class="leaderboard-empty">Could not load scores. Check Firestore rules.</div>`;
    }
  }

  function placeTarget(){
    const old = board.querySelector(".game-target");
    if (old) old.remove();

    const target = document.createElement("button");
    target.type = "button";
    target.className = "game-target";
    target.textContent = "●";

    const maxX = Math.max(10, board.clientWidth - 62);
    const maxY = Math.max(10, board.clientHeight - 62);
    target.style.left = `${10 + Math.random() * (maxX - 10)}px`;
    target.style.top = `${10 + Math.random() * (maxY - 10)}px`;

    target.addEventListener("click", () => {
      if (!activeGame.running) return;
      activeGame.score += 1;
      scoreEl.textContent = activeGame.score;
      placeTarget();
    });

    board.appendChild(target);
  }

  function stopGame(){
    if (!activeGame || !activeGame.running) return;
    activeGame.running = false;
    clearInterval(activeGame.timer);
    activeGame.timer = null;

    const target = board.querySelector(".game-target");
    if (target) target.remove();

    message.innerHTML = `<strong>Game Over!</strong><span>Your score: ${activeGame.score}</span>`;
    message.classList.remove("hidden");
    saveGameScore("game-over");
  }

  function startGame(){
    const player = playerInput.value.trim();
    if (!player) {
      status.textContent = "Enter your name first.";
      status.className = "status-msg err";
      playerInput.focus();
      return;
    }
    if (!firebaseReady) {
      status.textContent = "Firebase isn't configured.";
      status.className = "status-msg err";
      return;
    }

    if (activeGame.running) return;

    activeGame.running = true;
    activeGame.saved = false;
    activeGame.player = player;
    activeGame.score = 0;
    activeGame.timeLeft = 30;

    scoreEl.textContent = "0";
    timeEl.textContent = "30";
    status.textContent = "Game on!";
    status.className = "status-msg ok";
    message.classList.add("hidden");

    placeTarget();

    activeGame.timer = setInterval(() => {
      activeGame.timeLeft -= 1;
      timeEl.textContent = activeGame.timeLeft;

      if (activeGame.timeLeft <= 0) stopGame();
    }, 1000);
  }

  async function saveGameScore(reason){
    if (!activeGame || activeGame.saved || !activeGame.player || activeGame.score < 0) return;
    activeGame.saved = true;

    if (activeGame.running) {
      activeGame.running = false;
      clearInterval(activeGame.timer);
      activeGame.timer = null;
    }

    if (!firebaseReady) return;

    try {
      await db.collection("game_scores").add({
        name: activeGame.player,
        score: activeGame.score,
        game: "catch-the-dot",
        reason,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      status.textContent = "Score saved!";
      status.className = "status-msg ok";
      await loadLeaderboard();
    } catch (e) {
      activeGame.saved = false;
      console.error(e);
      status.textContent = "Score could not be saved. Check Firestore rules.";
      status.className = "status-msg err";
    }
  }

  startBtn.addEventListener("click", startGame);
  leaveBtn.addEventListener("click", async () => {
    if (!activeGame.player) {
      status.textContent = "Start a game first.";
      status.className = "status-msg err";
      return;
    }
    await saveGameScore("left-game");
    message.innerHTML = `<strong>Score saved!</strong><span>You can start another round anytime.</span>`;
    message.classList.remove("hidden");
  });

  el.querySelector("#leaderboard-refresh").addEventListener("click", loadLeaderboard);
  loadLeaderboard();
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================================
   MODAL
   ========================================================================= */
const modalBackdrop = document.getElementById("modal-backdrop");
const modalBody = document.getElementById("modal-body");
function openModal(html){ modalBody.innerHTML = html; modalBackdrop.classList.add("show"); }
function closeModal(){ modalBackdrop.classList.remove("show"); }
document.getElementById("modal-close").addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

/* =========================================================================
   VISIT COUNTER → shown as a ticket / order number
   ========================================================================= */
async function bumpVisitCounter(){
  const el = document.getElementById("ticket-num");
  if (!firebaseReady) { el.textContent = "N/A"; return; }
  try {
    const ref = db.collection("stats").doc("visits");
    const snap = await ref.get();
    if (snap.exists) {
      await ref.update({ count: firebase.firestore.FieldValue.increment(1) });
      el.textContent = "#" + String((snap.data().count || 0) + 1).padStart(3, "0");
    } else {
      await ref.set({ count: 1 });
      el.textContent = "#001";
    }
  } catch (e) {
    console.error(e);
    el.textContent = "ERR";
  }
}

function tickClock(){ document.getElementById("clock").textContent = new Date().toLocaleTimeString(); }
setInterval(tickClock, 1000);
tickClock();
