<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chester's Portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23DA291C%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23FFC72C%22 font-family=%22sans-serif%22 font-weight=%22bold%22>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Animated pixel-art sky background — layers by Jenaro Calvino (codepen.io/jenaroc/pen/BagQbBx) -->
<div id="scenery" aria-hidden="true">
  <div class="scn-bg"></div>
  <div class="scn-clouds"></div>
  <div class="scn-clouds-front"></div>
  <div class="scn-beach"></div>
  <div class="scn-char"></div>
</div>

<!-- ========== START SCREEN ========== -->
<div id="start-screen">
  <div class="start-card">
    <div class="logo-badge" id="logo-badge">?</div>
    <h1 id="start-title">WELCOME</h1>
    <p id="start-sub">Tap anywhere to start your visit</p>
    <button id="start-btn" class="btn-primary big">TAP TO START</button>
  </div>
</div>

<!-- ========== KIOSK ========== -->
<div id="kiosk" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <div class="logo-badge small" id="logo-badge-2">?</div>
      <div class="brand-text">
        <div class="brand-name" id="brand-name">NAME</div>
        <div class="brand-tag" id="brand-tag">tagline</div>
      </div>
    </div>
    <div class="ticket">
      <div class="ticket-label">VISITOR NO.</div>
      <div class="ticket-num" id="ticket-num">—</div>
    </div>
  </header>

  <nav class="catbar" id="catbar"><!-- category buttons injected --></nav>

  <main class="stage" id="stage"><!-- screen content injected --></main>

  <footer class="bottombar">
    <span id="bottom-hint">Choose a category above</span>
    <span id="clock"></span>
  </footer>
</div>

<!-- ========== ITEM MODAL ========== -->
<div id="modal-backdrop" class="modal-backdrop">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-body"><!-- injected --></div>
  </div>
</div>

<!-- Firebase (classic/compat build — works straight off the file system, no server needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
